# Thin local smoke overrides for the frozen SkyRL-v0 PPO config.
data:
  train_batch_size: 1
  max_prompt_length: 1024
  max_response_length: 256
  dataloader_num_workers: 0

actor_rollout_ref:
  model:
    path: ${oc.env:SKYRL_MODEL_PATH,tests/e2e/arithmetic_sequence/model}
    training_mode: lora
    lora_rank: 2
    lora_alpha: 4
    lora_dropout: 0.0
    lora_target_modules: null
  actor:
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    masking: true
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    task_type: swegym
    name: async
    n_trajectories: 2
    max_iterations: 2
    max_parallel_agents: 1
    max_eval_parallel_agents: 1
    max_starting_message_length: 12000
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    enable_memory_saver: true

algorithm:
  adv_estimator: grpo

reward_model:
  reward_manager: swebench_test_informed
  test_informed:
    target_weight: 0.8
    regression_weight: 0.2

trainer:
  nnodes: 1
  n_gpus_per_node: 1

smoke:
  environment_task_count: 1
  environment_trajectories: 1
  training_requires_distinct_rewards: true
  rollout_weight_sync_required: false
